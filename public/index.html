<!DOCTYPE html>
<html lang="tl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRASTOK BOT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤬</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Forcing a standard monospace font to emulate a typewriter -->
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Custom scrollbar for the gritty feel */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #fff;
      border-left: 4px solid #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #000;
    }
  </style>
</head>

<!-- h-[100dvh] applied here for mobile keyboard support -->

<body
  class="bg-zinc-300 bg-[radial-gradient(#000_2px,transparent_2px)] [background-size:16px_16px] text-black h-[100dvh] m-0 overflow-hidden">

  <!-- CONSENT SCREEN -->
  <div id="consent-screen" class="relative h-full flex items-center justify-center px-4">
    <div
      class="bg-white p-6 sm:p-8 max-w-md w-full border-4 border-black shadow-[8px_8px_0_0_rgba(0,0,0,1)] sm:shadow-[12px_12px_0_0_rgba(0,0,0,1)]">

      <h1 class="text-4xl sm:text-5xl font-black tracking-tighter uppercase border-b-4 border-black pb-2 mb-4">
        Trastok Bot
      </h1>

      <p class="font-bold text-lg leading-snug mb-4">
        WARNING: CHATBOT NA MAGMUMURA AT MANGLOLOKO SAYO. PUNO NG TAGALOG CURSE WORDS AT KALOKOHAN.
      </p>

      <p class="bg-black text-white p-3 font-bold text-sm mb-6 uppercase">
        Hindi ito para sa iyakin. Kung sensitive ka, isara mo na 'to bago ka pa umiyak.
      </p>

      <label class="flex items-start gap-3 text-left font-bold text-sm mb-8 cursor-pointer select-none">
        <input type="checkbox" id="consent-box"
          class="mt-1 min-w-[20px] w-5 h-5 appearance-none border-2 border-black bg-white checked:bg-black checked:relative checked:after:content-['X'] checked:after:text-white checked:after:absolute checked:after:left-[3px] checked:after:-top-[2px]" />
        ALAM KO NA MAGMUMURA ANG BOT NA ITO AT HANDA AKO.
      </label>

      <button id="enter-btn" disabled
        class="w-full bg-white border-4 border-black text-black font-black text-xl uppercase py-4 hover:bg-black hover:text-white disabled:opacity-50 disabled:hover:bg-white disabled:hover:text-black transition-none cursor-pointer disabled:cursor-not-allowed shadow-[6px_6px_0_0_rgba(0,0,0,1)] active:shadow-none active:translate-x-[6px] active:translate-y-[6px]">
        Sige, Palag
      </button>

    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="hidden relative h-full flex items-center justify-center p-0 sm:p-6">
    <div
      class="w-full max-w-2xl h-full sm:max-h-[850px] bg-white sm:border-4 border-black flex flex-col sm:shadow-[16px_16px_0_0_rgba(0,0,0,1)]">

      <!-- HEADER -->
      <header
        class="flex justify-between items-center px-4 sm:px-6 py-3 sm:py-4 bg-black text-white border-b-4 border-black">
        <h1 class="text-xl sm:text-2xl font-black uppercase tracking-widest">Trastok Bot</h1>
        <button id="exit-btn"
          class="bg-white text-black font-bold uppercase text-sm sm:text-base px-3 py-1 sm:px-4 sm:py-2 border-2 border-white hover:bg-transparent hover:text-white transition-none">
          Takas
        </button>
      </header>

      <!-- MESSAGES FEED -->
      <div id="messages" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-4 sm:gap-6 bg-zinc-100"></div>

      <!-- INPUT FORM -->
      <form id="chat-form" class="flex flex-col sm:flex-row gap-2 sm:gap-4 p-3 sm:p-6 bg-white border-t-4 border-black">

        <textarea id="chat-input" placeholder="UMANGAL KA DITO..." autocomplete="off"
          class="flex-1 bg-white text-black border-4 border-black px-3 py-3 sm:px-4 font-bold text-base sm:text-lg outline-none focus:bg-zinc-100 resize-none min-h-[56px] max-h-32 overflow-y-auto placeholder:text-zinc-400"></textarea>
        <div class="flex gap-2 h-full">
          <button type="button" id="clear-btn"
            class="bg-zinc-300 border-4 border-black text-black font-black uppercase px-4 py-2 sm:py-3 hover:bg-zinc-400 active:translate-y-1">
            X
          </button>

          <button type="submit"
            class="flex-1 sm:flex-none bg-black border-4 border-black text-white font-black uppercase px-6 py-2 sm:py-3 hover:bg-white hover:text-black transition-none active:translate-y-1">
            Send
          </button>
        </div>

      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
